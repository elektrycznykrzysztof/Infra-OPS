services:
  postgres:
    build:
      context: ./docker/postgres
    image: infra-ops-postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ssh_fingerprints:/data
      - postgres_logs:/var/log/postgresql:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    profiles: ["discord"]

volumes:
  postgres_data:
  postgres_logs:
  ssh_fingerprints:
